name: tests

on:
  pull_request:
    branches:
      - main

jobs:
  do-tofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/do_tofu_version.sh sns/scripts/aws/do_tofu

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y bats jq
      - run: bats sns/scripts/tests/aws/ sns/utils/tests/

  tofu-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Validate with the version do_tofu pins, read from the script so the two cannot drift.
      - id: pin
        run: echo "version=$(sed -n 's/^[[:space:]]*TOFU_VERSION="\([0-9.]*\)".*/\1/p' sns/scripts/aws/do_tofu | head -1)" >> "$GITHUB_OUTPUT"
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ steps.pin.outputs.version }}
      - run: |
          set -e
          for dir in sns/deployment sns/permissions sns/specs/requirements/aws sns/publish; do
            tofu fmt -check "$dir"
            tofu -chdir="$dir" init -backend=false -input=false
            tofu -chdir="$dir" validate
          done
